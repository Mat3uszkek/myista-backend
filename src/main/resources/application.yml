spring:
  application:
    name: myista-backend
  jackson:
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-properties: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:myista-dev-secret-key-change-in-production-at-least-32-chars!}
    expiration-ms: 3600000   # 1 hour
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

tenantapi:
  host: ${TENANTAPI_HOST:http://localhost:8001}
  app-id: ${TENANTAPI_APP_ID:demo}
  kiosk-username: ${TENANTAPI_KIOSK_USERNAME:}
  kiosk-password: ${TENANTAPI_KIOSK_PASSWORD:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}

ngenius:
  url: ${NGENIUS_URL:}
  username: ${NGENIUS_USERNAME:}
  password: ${NGENIUS_PASSWORD:}
  outlet: ${NGENIUS_OUTLET:}
  webhook:
    username: ${NGENIUS_WEBHOOK_USERNAME:}
    password: ${NGENIUS_WEBHOOK_PASSWORD:}

cbq:
  url: ${CBQ_URL:}
  merchant-id: ${CBQ_MERCHANT_ID:}
  password: ${CBQ_PASSWORD:}
  js-lib-url: ${CBQ_JS_LIB_URL:}
  notification-url: ${CBQ_NOTIFICATION_URL:}

worldpay:
  url: ${WORLDPAY_URL:https://secure.worldpay.com/jsp/merchant/xml/paymentService.jsp}
  merchant-code: ${WORLDPAY_MERCHANT_CODE:}
  xml-password: ${WORLDPAY_XML_PASSWORD:}
  js-lib-url: ${WORLDPAY_JS_LIB_URL:https://secure.worldpay.com/wcc/wrappedMessages}

aps:
  merchant-identifier: ${APS_MERCHANT_IDENTIFIER:}
  access-code: ${APS_ACCESS_CODE:}
  sha-request-phrase: ${APS_SHA_REQUEST_PHRASE:}
  hpp-url: ${APS_HPP_URL:https://checkout.payfort.com/FortAPI/paymentPage}

# uksql01 — MinuteView DB: Help, N-Genius webhooks, consumption projection sproc
# ukbiz04 — OperationsDW: seasonal consumption direct SQL
mssql:
  uksql01:
    url: ${DB_UKSQL01_URL:jdbc:sqlserver://uksql01;databaseName=MinuteView;encrypt=false}
    username: ${DB_UKSQL01_USERNAME:}
    password: ${DB_UKSQL01_PASSWORD:}
  ukbiz04:
    url: ${DB_UKBIZ04_URL:jdbc:sqlserver://ukbiz04;databaseName=OperationsDW;encrypt=false}
    username: ${DB_UKBIZ04_USERNAME:}
    password: ${DB_UKBIZ04_PASSWORD:}

logging:
  level:
    com.ista.myista: DEBUG
